[project]
site_url = "https://www.devink.ir/"
site_name = "Devink Docs"
site_description = "Official documentation for Devink, a Medium-inspired platform for developers to share technical knowledge and ideas."
site_author = "Alireza Esmaeilpour"

copyright = "Copyright &copy; 2026 Devink"

repo_url = "https://github.com/AlirezaEsp/Devink"
repo_name = "Devink"
# edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Product" = "product.md" },
  { "Requirements" = "requirements.md" },
  { "Architecture" = "architecture.md" },
  { "Database" = "database.md" },
  { "API" = "api.md" },
  { "Development" = "development.md" },
  { "Security" = "security.md" },
  { "Deployment" = "deployment.md" },
  { "Operations" = "operations.md" },
  { "Decisions" = [
    "decisions/index.md",
    "decisions/adr-001-separate-frontend-and-backend.md",
    "decisions/adr-002-choose-laravel-for-the-backend.md",
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
variant = "modern"
# custom_dir = "overrides"
favicon = "lucide/file-code-2"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

[project.theme.icon]
logo = "lucide/file-code-2"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AlirezaEsp/Devink"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# for generalized instant preview
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
sources.include = [] # (1)!
sources.exclude = []
targets.include = [] # (2)!
targets.exclude = []
